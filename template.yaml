metadata:
  atespace: ate-demo-pi
  name: pi-durable-data
workerSelector:
  matchLabels:
    workload: pi-durable
containers:
- name: pi-durable
  image: localhost:5001/pi-durable-actor@sha256:0a0695101832ffab6a8f5627d21afd22e3b7cd28940777d7f237c1894d82437b
  command:
  - node
  - /app/server.ts
  env:
  - name: GEMINI_API_KEY
    value: ate-placeholder-key
  - name: NODE_EXTRA_CA_CERTS
    value: /run/ate/trust-bundle.pem
  wakeupProbe:
    httpGet:
      path: /readyz
      port: 80
    timeoutSeconds: 30
  volumeMounts:
  - name: workspace
    mountPath: /workspace
  - name: system-info
    mountPath: /run/ate
resources:
  limits:
  - name: cpu
    quantity: "1"
  - name: memory
    quantity: 512Mi
snapshotConfig:
  onPause: SNAPSHOT_CONTENT_SCOPE_DATA
  onCommit: SNAPSHOT_CONTENT_SCOPE_DATA
  # Uses the bundled rustfs bucket on kind; on GKE, set to gs://<your-gcs-bucket>/...
  storageLocation: gs://ate-snapshots/ate-demo-pi-data/
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_GVISOR
  configName: gvisor-default
volumes:
- name: workspace
  durableDir: {}
- name: system-info
  systemInfo:
    dataSources:
    - trustBundle:
        names:
        - egress-mitm.ate.dev
        path: trust-bundle.pem
